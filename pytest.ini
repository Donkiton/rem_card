[pytest]
testpaths = tests
addopts = --strict-markers
markers =
    core: логика, хранение данных и инфраструктура
    ui: тесты Qt и интерфейса в отдельном процессе
    database: БД, репликация, блокировки и резервное копирование
    updates: запуск, сборка и обновления
    clinical: клинические расчёты и аналитика
    infrastructure: общие контракты и инфраструктура
