function showNode(n){var up=Array.from(reach(n.id,true)).map(function(x){return map.get(x).label}),down=Array.from(reach(n.id,false)).map(function(x){return map.get(x).label}),flows=d.flows.filter(function(f){return f.steps.indexOf(n.id)>=0});details.innerHTML="<h2>"+esc(n.label)+"</h2><code>"+esc(n.path)+'</code><div class="kind" style="border-color:'+colors[n.type]+';color:'+colors[n.type]+'">'+esc(typeRu[n.type])+" · "+esc(bShort[n.boundary])+"</div><p>"+esc(n.role)+"</p>"+list("Точки входа",n.entrypoints,true)+list("Ограничения",n.constraints,false)+list("Связанные тесты",n.tests,true)+list("Вызывающие модули",up,false)+list("Нижележащие зависимости",down,false)+(flows.length?"<h3>Сквозные потоки</h3>"+flows.map(function(f){return'<div class="flow-card"><b>'+esc(f.name)+"</b>"+esc(f.trigger)+"</div>"}).join(""):"")+evidence(n.evidence)}
function showEdge(e){details.innerHTML="<h2>"+esc(map.get(e.from).label)+" → "+esc(map.get(e.to).label)+'</h2><div class="kind">'+esc(edgeRu[e.type]||e.type)+"</div><p>"+esc(e.label)+"</p>"+evidence(e.evidence)}
function showFlow(f){details.innerHTML="<h2>"+esc(f.name)+'</h2><div class="kind" style="color:var(--flow)">сквозной поток</div><h3>Триггер</h3><p>'+esc(f.trigger)+"</p><h3>Путь</h3><ul>"+f.steps.map(function(id,i){return"<li><b>"+(i+1)+".</b> "+esc(map.get(id).label)+"</li>"}).join("")+"</ul><h3>Результат</h3><p>"+esc(f.outcome)+"</p>"}
function empty(){details.innerHTML='<div class="empty">Выберите модуль, связь или поток, чтобы увидеть свидетельства, вызывающие модули, зависимости, тесты и ограничения.<div class="legend">'+Object.keys(colors).map(function(t){return'<span><i style="background:'+colors[t]+'"></i>'+typeRu[t]+"</span>"}).join("")+"</div></div>"}
function controls(){var types=document.getElementById("types");Object.keys(colors).forEach(function(t){var b=document.createElement("button");b.style.setProperty("--c",colors[t]);b.textContent=typeRu[t];b.onclick=function(){hidden.has(t)?hidden.delete(t):hidden.add(t);b.classList.toggle("off",hidden.has(t));state()};types.appendChild(b)});var fs=document.getElementById("flow");d.flows.forEach(function(f){var o=document.createElement("option");o.value=f.id;o.textContent=f.name;fs.appendChild(o)});fs.onchange=function(){flowId=fs.value||null;selected=null;if(flowId)showFlow(d.flows.find(function(f){return f.id===flowId}));else empty();state()}}
function apply(){view.setAttribute("transform","translate("+tr.x+" "+tr.y+") scale("+tr.k+")")}function zoom(q,x,y){var old=tr.k,n=Math.max(.35,Math.min(2.5,old*q));tr.x=x-(x-tr.x)*n/old;tr.y=y-(y-tr.y)*n/old;tr.k=n;apply()}function fit(){tr={x:0,y:0,k:1};apply()}
svg.onwheel=function(ev){ev.preventDefault();var r=svg.getBoundingClientRect();zoom(ev.deltaY<0?1.12:.89,ev.clientX-r.left,ev.clientY-r.top)};svg.onpointerdown=function(ev){if(ev.target.closest&&ev.target.closest(".node"))return;svg.setPointerCapture(ev.pointerId);pan={x:ev.clientX,y:ev.clientY,tx:tr.x,ty:tr.y};svg.classList.add("pan")};svg.onpointermove=function(ev){if(!pan)return;tr.x=pan.tx+ev.clientX-pan.x;tr.y=pan.ty+ev.clientY-pan.y;apply()};svg.onpointerup=function(){pan=null;svg.classList.remove("pan")};
document.getElementById("search").oninput=function(ev){query=ev.target.value.trim().toLowerCase();state()};document.getElementById("zin").onclick=function(){zoom(1.2,svg.clientWidth/2,svg.clientHeight/2)};document.getElementById("zout").onclick=function(){zoom(.83,svg.clientWidth/2,svg.clientHeight/2)};document.getElementById("fit").onclick=fit;document.getElementById("reset").onclick=function(){selected=null;flowId=null;query="";hidden.clear();document.getElementById("search").value="";document.getElementById("flow").value="";document.querySelectorAll(".types button").forEach(function(b){b.classList.remove("off")});layout();nels.forEach(function(g,id){var p=pos.get(id);g.setAttribute("transform","translate("+p.x+" "+p.y+")")});redraw();fit();empty();state()};
document.getElementById("generated").textContent=d.generated_at;document.getElementById("commit").textContent=d.generated_from_commit.slice(0,12);document.getElementById("nc").textContent=d.nodes.length+" модулей";document.getElementById("ec").textContent=d.edges.length+" связей";document.getElementById("fc").textContent=d.flows.length+" потоков";
layout();draw();controls();empty();state();
})();
</script>
</body></html>
