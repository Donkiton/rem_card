<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Общий рабочий контур Рем Карты</title>
  <desc id="desc">Рабочие места врача, медсестры и оперблока связаны с общей папкой данных, медицинской базой, настройками и резервными копиями.</desc>

  <defs>
