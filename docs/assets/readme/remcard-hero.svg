<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">Рем Карта — цифровой рабочий контур реанимации</title>
  <desc id="desc">Заголовок проекта с клинической картой смены, демонстрационными витальными показателями и кардиолиниями.</desc>

  <defs>
