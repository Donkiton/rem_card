  </defs>

  <rect width="1200" height="380" rx="28" fill="url(#background)"/>
  <circle cx="1120" cy="28" r="176" fill="#14243B" opacity="0.55"/>
  <circle cx="1048" cy="344" r="132" fill="#162338" opacity="0.72"/>

