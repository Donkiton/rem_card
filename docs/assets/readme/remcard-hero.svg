      <stop offset="1" stop-color="#101B2D"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F45B69"/>
      <stop offset="1" stop-color="#D7263D"/>
    </linearGradient>
    <clipPath id="timeline-clip">
      <rect x="742" y="76" width="394" height="228" rx="24"/>
