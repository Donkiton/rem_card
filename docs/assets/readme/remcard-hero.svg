  <rect width="1200" height="410" rx="28" fill="#0B1220"/>
  <path d="M0 342 H1200" stroke="#243147" stroke-width="1"/>
  <path d="M58 342 H516 L538 342 L553 310 L573 375 L596 263 L620 342 H696" fill="none" stroke="#D7263D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

