name: Подготовить Windows-проверки
description: Общее окружение Python и Qt для всех проверок RemCard
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: requirements.txt
    - name: Установить зависимости
      shell: pwsh
      run: python -m pip install -r requirements.txt
    - name: Настроить часовой пояс
      shell: pwsh
      run: tzutil /s "Vladivostok Standard Time"
