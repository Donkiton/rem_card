name: Обновление сайта и README после релиза

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-release-sync
  cancel-in-progress: false

jobs:
  synchronize:
    if: >-
      github.repository == 'Donkiton/rem_card' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.release.draft == false && github.event.release.prerelease == false))
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Проверить одноразовую настройку приложения
        env:
          APP_ID: ${{ vars.PUBLIC_RELEASE_APP_ID }}
          APP_KEY: ${{ secrets.PUBLIC_RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "Настройте PUBLIC_RELEASE_APP_ID и PUBLIC_RELEASE_APP_PRIVATE_KEY по docs/public_release_automation.md"
            exit 1
          fi
      - name: Получить проверенные исходники автоматизации
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Настроить Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Настроить Node.js для автономного генератора сайта
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Получить временный ключ только двух репозиториев
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.PUBLIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.PUBLIC_RELEASE_APP_PRIVATE_KEY }}
          owner: Donkiton
          repositories: |
            rem_card
            rem_site
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
          permission-checks: read
          permission-statuses: read
      - name: Обновить публичные материалы через подписанные PR и обычный CI
        env:
          PUBLIC_RELEASE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          python -m scripts.public_release_bot
          --root "$GITHUB_WORKSPACE"
          --event-file "$GITHUB_EVENT_PATH"
          --summary "$GITHUB_STEP_SUMMARY"
