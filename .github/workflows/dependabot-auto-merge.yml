name: Автослияние Dependabot

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'Donkiton/rem_card' &&
      startsWith(github.head_ref, 'dependabot/pip/routine-updates-')
    runs-on: ubuntu-latest
    steps:
      - name: Включить автослияние сгруппированных patch- и minor-обновлений
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          PR_URL: "${{ github.event.pull_request.html_url }}"
